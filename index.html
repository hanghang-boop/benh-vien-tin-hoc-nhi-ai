<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bệnh viện Tin học nhí AI</title><style>
:root{--ink:#1f3a5f;--teal:#0fa3a3;--teal-d:#0a7f86;--sun:#ffc93c;--coral:#ff6b6b;--sky:#4aa8ff;--grape:#8a63d2;--mint:#d9f7ee;--paper:#fffdf7;
font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;color:var(--ink);background:#e8f8f5;font-size:17px}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 12px 12px,#cfeee8 2px,transparent 3px) 0 0/28px 28px,linear-gradient(180deg,#e8f8f5,#fff7e0);min-height:100vh}
header{position:relative;background:linear-gradient(135deg,#0fa3a3,#4aa8ff);color:#fff;padding:28px max(18px,calc((100vw - 1050px)/2)) 52px;border-radius:0 0 40px 40px;box-shadow:0 8px 0 #0a7f86;overflow:hidden}
header:after{content:"🩺 💊 🩹 🖥️ ⭐";position:absolute;right:22px;bottom:26px;font-size:28px;letter-spacing:8px;opacity:.9;animation:bob 3s ease-in-out infinite}
h1{margin:0;font-size:clamp(26px,5vw,44px);text-shadow:0 3px 0 #0a7f86;line-height:1.15}

header p span{background:#ffffff2e;border:2px solid #ffffff66;border-radius:999px;padding:5px 14px;font-weight:700;font-size:15px}
main{max-width:1050px;margin:-30px auto 0;padding:0 20px 20px;position:relative}
.panel{background:var(--paper);border:3px solid #bfe9e1;border-radius:26px;padding:22px;margin-bottom:20px;box-shadow:0 6px 0 #bfe9e1}
h2{margin-top:0;color:var(--teal-d);font-size:26px}h3{color:var(--grape)}
label{display:block;margin:14px 0 6px;font-weight:700}
input,select{width:100%;padding:14px;border:3px solid #cfe3f5;border-radius:16px;font:inherit;background:#fff;color:var(--ink)}

button{padding:12px 22px;min-height:46px;background:var(--teal);border:0;color:#fff;border-radius:999px;font:inherit;font-weight:800;cursor:pointer;margin:6px 6px 6px 0;box-shadow:0 5px 0 var(--teal-d);transition:transform .12s,box-shadow .12s}

button:focus-visible{outline:4px solid var(--sun)}
.alt{background:var(--grape);box-shadow:0 5px 0 #6a47ad}.alt:hover{background:#9a74e0;box-shadow:0 7px 0 #6a47ad}
.danger{background:var(--coral);box-shadow:0 5px 0 #d44a4a}.danger:hover{background:#ff7d7d;box-shadow:0 7px 0 #d44a4a}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.muted{color:#5d7390}

.good{color:#0f8a52;font-weight:800}.bad{color:#d63d4a;font-weight:800}
.stat{padding:18px;border-radius:22px;background:#e3f2ff;border:3px solid #b8dcff;text-align:center}
.grid .stat:nth-child(4n+2){background:#fff0d6;border-color:#ffd88a}.grid .stat:nth-child(4n+3){background:#e6f9ea;border-color:#a9e5b8}.grid .stat:nth-child(4n){background:#f0e8ff;border-color:#cdb6f5}
.stat b{font-size:34px;display:block}
table{width:100%;border-collapse:collapse;font-size:15px;background:#fff;border-radius:14px;overflow:hidden}
th{background:var(--teal);color:#fff}th,td{padding:10px;border-bottom:2px solid #e6f0f5;text-align:left}
.scroll{overflow:auto}
.task{border:3px solid #cfe3f5;border-radius:22px;padding:16px 18px;margin:12px 0;background:#fff;transition:transform .15s,box-shadow .15s}

.task:hover{transform:translateY(-3px);box-shadow:0 6px 0 #cfe3f5}
.task strong{display:block;font-size:19px}
.task h3{font-size:19px;margin:0 0 6px}
#message{position:sticky;top:8px;z-index:5}
#message .panel{font-size:18px;text-align:center;margin-bottom:10px}
#message .good{background:#e0f8e9;border-color:#6fd49a;box-shadow:0 6px 0 #6fd49a}
#message .bad{background:#ffe5e5;border-color:#ff9a9a;box-shadow:0 6px 0 #ff9a9a}
.hide{display:none}.steps{line-height:1.8}
.tag{font-size:13px;font-weight:700;background:#d9f7ee;color:var(--teal-d);padding:4px 12px;border-radius:999px;border:2px solid #aeeadb}
footer{text-align:center;color:#5d7390;padding:24px;font-size:15px}
.sim{background:#fff;border:3px dashed var(--sky);border-radius:22px;padding:18px;margin:16px 0}
.folder{display:inline-block;cursor:pointer;user-select:none;border:3px solid #ffd88a;background:#fff8e6;border-radius:20px;padding:22px 26px;margin:10px;font-size:24px;transition:transform .15s}
.folder:hover{transform:scale(1.08) rotate(-2deg)}
.codeblock{background:#fff0c2;border:3px solid #f0b429;padding:16px;border-radius:18px;margin:14px 0;font-weight:800;font-size:19px}
.folderbtn{margin:4px}
@keyframes bob{50%{transform:translateY(6px)}}
@media(max-width:640px){header:after{display:none}.panel{padding:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.chart-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:14px 0}.chart-legend{display:flex;gap:18px;flex-wrap:wrap;font-weight:700}.chart-dot{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px}.chart-frame{overflow-x:auto;background:white;border:2px solid #e1edf7;border-radius:18px;padding:10px}.chart-frame svg{display:block;width:100%;height:auto;min-width:420px}.chart-summary{margin-top:12px;color:#526b87;font-size:15px}

async function api(action,p={}){
 const response=await fetch('/.netlify/functions/api',{method:'POST',headers:{'Content-Type':'application/json',...(authToken?{'Authorization':'Bearer '+authToken}:{})},body:JSON.stringify({action,...p})});
 let r;try{r=await response.json()}catch{throw Error('Không kết nối được máy chủ Netlify. Vui lòng kiểm tra triển khai.')}
 if(!response.ok)throw Error(r.error||'Máy chủ báo lỗi '+response.status);
 return r;
}

 return '';

function simAnswer(id){
 if(id==='MOUSE1')return simState.opened?'Nháy đúp':'Nháy đơn';
 if(id==='SAVE1')return simState.folder;
 if(id==='SAVE4')return simState.copy?'Sao chép':'Di chuyển';
 if(id==='WORD1')return simState.bold?'Đậm':'Ẩn';

 `<div class="choices">${full.choices.map(choice=>`<label style="display:flex;gap:10px;align-items:center;padding:9px;border:1px solid #dbe6ef;border-radius:9px;margin:7px 0"><input type="radio" name="taskAnswer" value="${esc(choice)}" style="width:auto"> ${esc(choice)}</label>`).join('')}</div>`:

async function submitTask(id){
 const t=demoTasks.find(x=>x.id===id);
 const value=interactiveIds.has(id.split('-').slice(1).join('-'))?simAnswer(id.split('-').slice(1).join('-')):t.choices.length?(document.querySelector('input[name="taskAnswer"]:checked')?.value||''):(document.querySelector('#answer')?.value||'');
 if(!value.trim()){alertMsg('Em hãy hoàn thành nhiệm vụ trước khi kiểm tra.');return;}
 try{
  let r=await api('submit',{taskId:id,value});lastEvent=r.eventId;
  document.querySelector('#result').innerHTML=`<div class="notice"><h3 class="${r.passed?'good':'bad'}">${r.passed?'✅ Đạt – Em đã thực hiện đúng!':'🔎 Chưa đạt – Hãy thử sửa lại!'}</h3><p><strong>Đơn thuốc hướng dẫn:</strong> ${esc(r.advice)}</p><button onclick="getAI()">✨ Nhờ bác sĩ Gemini AI tư vấn</button><div id="aiResult"></div></div>`;
  history();
 }catch(e){alertMsg(e.message)}
}

async function history(){try{let r=await api('myHistory');let e=r.events||[];document.querySelector('#history').innerHTML=e.length?`<div class="scroll"><table><tr><th>Thời gian</th><th>Ca bệnh</th><th>Kết quả</th></tr>${e.slice().reverse().map(x=>`<tr><td>${new Date(x.time).toLocaleString('vi-VN')}</td><td>${esc(tasks.find(t=>t.id===x.taskId)?.name||x.taskId)}</td><td class="${x.passed?'good':'bad'}">${x.passed?'Đạt':'Chưa đạt'}</td></tr>`).join('')}</table></div>`:'Chưa có lượt thực hành.'}catch(e){alertMsg(e.message)}}
async function teacher(){try{let r=await api('report'),students=r.students||[],events=r.events||[],latest=new Map();events.forEach(e=>latest.set(e.code+'|'+e.taskId,e));let pending=[...latest.values()].filter(e=>!e.passed),improved=0,by=new Map();events.forEach(e=>{let k=e.code+'|'+e.taskId;if(!by.has(k))by.set(k,[]);by.get(k).push(e)});for(let arr of by.values())if(arr.length>=2&&!arr[0].passed&&arr.at(-1).passed)improved++;let counts={};pending.forEach(e=>counts[e.taskId]=(counts[e.taskId]||0)+1);root.innerHTML=`<div class="panel"><button class="alt" onclick="logout()">Đăng xuất</button><h2>👩‍🏫 Trung tâm điều hành giáo viên</h2><div class="grid"><div class="stat"><b>${students.length}</b><p>Mã học sinh</p></div><div class="stat"><b>${events.length}</b><p>Lượt thực hành</p></div><div class="stat"><b>${pending.length}</b><p>Học sinh–lỗi còn chưa đạt</p></div><div class="stat"><b>${improved}</b><p>Học sinh–lỗi từ chưa đạt → đạt</p></div></div><h3>📊 Tình hình theo lớp</h3>${[3,4,5].map(g=>{let st=students.filter(x=>Number(x.className[0])===g),pe=pending.filter(x=>Number(x.className[0])===g);return `<p><strong>Lớp ${g}:</strong> ${st.length} mã học sinh · ${pe.length} cặp học sinh–lỗi chưa đạt</p>`}).join('')}<h3>🗺️ Bản đồ lỗi cần hỗ trợ</h3>${r.tasks.filter(t=>counts[t.id]).sort((a,b)=>(counts[b.id]||0)-(counts[a.id]||0)).slice(0,12).map(t=>`<p>🔴 ${esc(t.name)} (lớp ${t.grade}): <strong>${counts[t.id]}</strong> học sinh chưa đạt ở lượt gần nhất</p>`).join('')||'<p class="muted">Chưa có ca bệnh nào đang ở trạng thái Chưa đạt.</p>'}<button onclick="teacherAI()">✨ Nhờ AI gợi ý củng cố</button><div id="teacherAI"></div></div><div class="panel"><h2>📊 Biểu đồ cột Đạt / Chưa đạt theo khối và lớp</h2><p class="muted">Biểu đồ dùng kết quả <strong>lượt gần nhất của từng học sinh ở từng ca bệnh</strong>, tránh tính trùng các lần làm lại. Chọn khối để xem từng lớp trong khối; chọn tiếp một lớp để xem riêng lớp đó.</p><div class="chart-controls"><div><label for="chartGrade">Chọn khối</label><select id="chartGrade" onchange="updateChartClasses();renderLearningChart()"><option value="3" selected>Khối 3</option><option value="4">Khối 4</option><option value="5">Khối 5</option><option value="all">Tất cả các khối</option></select></div><div><label for="chartClass">Chọn lớp</label><select id="chartClass" onchange="renderLearningChart()"><option value="all">Tất cả các lớp</option></select></div></div><div id="learningChart" class="chart-frame" role="img" aria-label="Biểu đồ cột kết quả Đạt và Chưa đạt">Đang tải biểu đồ...</div><div class="chart-legend" style="justify-content:center;margin-top:12px"><span><i class="chart-dot" style="background:#0e8bff"></i>Đạt</span><span><i class="chart-dot" style="background:#9b5df8"></i>Chưa đạt</span></div><p id="learningChartInfo" class="chart-summary" aria-live="polite"></p></div><div class="panel"><h2>📌 Giao ca bệnh</h2><div class="grid"><div><label>Mã học sinh</label><select id="acode">${students.map(s=>`<option value="${esc(s.code)}">${esc(s.code)} – ${esc(s.className)}</option>`).join('')}</select></div><div><label>Ca bệnh</label><select id="atask">${r.tasks.filter(hienThi).map(t=>`<option value="${t.id}">${esc(t.name)} – Lớp ${t.grade}</option>`).join('')}</select></div></div><button onclick="assignTask()">Giao cho học sinh</button></div><div class="panel"><h2>🔑 Cấp lại PIN học sinh</h2><div class="grid"><div><label>Mã học sinh</label><input id="resetCode" placeholder="3A-01"></div><div><label>PIN mới (4–8 chữ số)</label><input id="resetPin" type="password" inputmode="numeric"></div></div><button onclick="resetPin()">Cấp lại mã</button></div>${backupControls()}<div class="panel"><h2>🩺 Học sinh cần hỗ trợ</h2><p class="muted">Các ca bệnh chưa đạt ở lượt thực hành gần nhất của từng học sinh.</p><div class="scroll"><table><thead><tr><th>Mã học sinh</th><th>Lớp</th><th>Ca bệnh chưa đạt</th><th>Thời gian gần nhất</th></tr></thead><tbody>${pending.slice().sort((a,b)=>new Date(b.time)-new Date(a.time)).slice(0,20).map(e=>`<tr><td><button class="alt" onclick="focusStudentHistory('${encodeURIComponent(e.code)}')">${esc(e.code)}</button></td><td>${esc(e.className)}</td><td>${esc(r.tasks.find(t=>t.id===e.taskId)?.name||e.taskId)}</td><td>${new Date(e.time).toLocaleString('vi-VN')}</td></tr>`).join('')||'<tr><td colspan="4">Chưa có học sinh cần hỗ trợ.</td></tr>'}</tbody></table></div>${pending.length>20?`<p class="muted">Đang hiển thị 20/${pending.length} ca cần hỗ trợ gần nhất. Dùng bộ lọc kết quả Chưa đạt ở bên dưới để tra cứu thêm.</p>`:''}</div><div class="panel"><h2>📋 Kết quả từng lượt</h2><button onclick="exportCSV()">Xuất CSV</button><button class="alt" onclick="summary()">📄 Tóm tắt số liệu cho hồ sơ</button><div id="summ"></div><div class="grid" style="margin:14px 0"><div><label for="historySearch">Tìm mã học sinh</label><input id="historySearch" placeholder="Ví dụ: 3A-01" oninput="historyPage=1;renderHistory()"></div><div><label for="historyClass">Lọc theo lớp</label><select id="historyClass" onchange="historyPage=1;renderHistory()"><option value="">Tất cả các lớp</option>${[...new Set(students.map(s=>s.className).concat(events.map(e=>e.className)))].filter(Boolean).sort().map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select></div><div><label for="historyResult">Kết quả</label><select id="historyResult" onchange="historyPage=1;renderHistory()"><option value="">Tất cả</option><option value="pass">Đạt</option><option value="fail">Chưa đạt</option></select></div><div><label for="historySize">Số lượt mỗi trang</label><select id="historySize" onchange="historyPage=1;renderHistory()"><option value="20">20 lượt</option><option value="50">50 lượt</option></select></div></div><p id="historyCount" class="muted" aria-live="polite"></p><div class="scroll"><table><thead><tr><th>Thời gian</th><th>Mã</th><th>Lớp</th><th>Ca bệnh</th><th>Kết quả</th></tr></thead><tbody id="historyRows"></tbody></table></div><div id="historyPager" style="margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap"></div></div>`;window.reportCache=r;historyPage=1;renderHistory();updateChartClasses();renderLearningChart();diagnostic()}catch(e){alertMsg(e.message)}}
function updateChartClasses(){
 const r=window.reportCache;if(!r)return;
 const grade=document.querySelector('#chartGrade')?.value||'all',sel=document.querySelector('#chartClass');if(!sel)return;
 const previous=sel.value;
 const classes=[...new Set([...(r.students||[]).map(s=>s.className),...(r.events||[]).map(e=>e.className)].filter(Boolean))].filter(c=>grade==='all'||String(c).trim().startsWith(grade)).sort((a,b)=>String(a).localeCompare(String(b),'vi',{numeric:true}));
 sel.innerHTML='<option value="all">Tất cả các lớp</option>'+classes.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('');
 sel.value=classes.includes(previous)?previous:'all';
}
function renderLearningChart(){
 const r=window.reportCache,container=document.querySelector('#learningChart'),info=document.querySelector('#learningChartInfo');if(!r||!container||!info)return;
 const grade=document.querySelector('#chartGrade')?.value||'all',cls=document.querySelector('#chartClass')?.value||'all';
 // Only the most recent attempt for each student/case contributes to the chart.
 const latest=new Map();(r.events||[]).forEach(e=>{const k=String(e.code)+'|'+String(e.taskId);if(!latest.has(k)||new Date(e.time)>=new Date(latest.get(k).time))latest.set(k,e)});
 const rows=[...latest.values()].filter(e=>e.className&&(grade==='all'||String(e.className).trim().startsWith(grade))&&(cls==='all'||e.className===cls));
 const grouped=new Map();rows.forEach(e=>{const label=cls!=='all'?e.className:grade==='all'?'Khối '+String(e.className).trim().charAt(0):e.className;if(!grouped.has(label))grouped.set(label,{name:label,pass:0,fail:0});grouped.get(label)[e.passed?'pass':'fail']++});
 let data=[...grouped.values()].sort((a,b)=>a.name.localeCompare(b.name,'vi',{numeric:true}));
 if(!data.length){container.innerHTML='<p class="muted" style="padding:18px">Chưa có lượt thực hành nào cho lựa chọn này.</p>';info.textContent='Biểu đồ sẽ tự cập nhật khi học sinh thực hành.';return}
 const W=Math.max(600,data.length*105+95),H=340,left=54,right=22,top=26,bottom=70,plotH=H-top-bottom,plotW=W-left-right,max=Math.max(1,...data.map(d=>Math.max(d.pass,d.fail))),step=Math.max(4,Math.ceil(max/5/4)*4),ceiling=Math.ceil(max/step)*step;
 let svg='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" aria-label="Biểu đồ cột Đạt và Chưa đạt">';
 for(let v=0;v<=ceiling;v+=step){const y=top+plotH-v/ceiling*plotH;svg+='<line x1="'+left+'" x2="'+(W-right)+'" y1="'+y+'" y2="'+y+'" stroke="#dfe6f0" stroke-dasharray="4 5"/><text x="'+(left-10)+'" y="'+(y+5)+'" text-anchor="end" font-size="13" fill="#63748c">'+v+'</text>'}
 const groupW=plotW/data.length,barW=Math.min(56,groupW*.3);
 data.forEach((d,i)=>{const center=left+(i+.5)*groupW;[[d.pass,'#0e8bff',-barW-3],[d.fail,'#9b5df8',3]].forEach(([v,color,offset])=>{const h=v/ceiling*plotH,x=center+offset,y=top+plotH-h;svg+='<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+h+'" rx="5" fill="'+color+'"><title>'+esc(d.name)+': '+v+' '+(color==='#0e8bff'?'Đạt':'Chưa đạt')+'</title></rect>'});svg+='<text x="'+center+'" y="'+(H-bottom+25)+'" text-anchor="middle" font-size="14" fill="#25415e">'+esc(d.name)+'</text>'});
 svg+='</svg>';container.innerHTML=svg;
 const pass=data.reduce((n,d)=>n+d.pass,0),fail=data.reduce((n,d)=>n+d.fail,0);info.textContent='Tổng: '+(pass+fail)+' cặp học sinh–ca bệnh · Đạt: '+pass+' · Chưa đạt: '+fail+'. Đây là số liệu thực tế từ báo cáo, không phải số liệu minh họa.';
}
let historyPage=1;
function focusStudentHistory(code){let input=document.querySelector('#historySearch');if(!input)return;input.value=decodeURIComponent(code);let result=document.querySelector('#historyResult');if(result)result.value='fail';historyPage=1;renderHistory();input.scrollIntoView({behavior:'smooth',block:'center'})}
function renderHistory(){let r=window.reportCache;if(!r)return;let q=(document.querySelector('#historySearch')?.value||'').trim().toLocaleLowerCase('vi-VN'),cls=document.querySelector('#historyClass')?.value||'',result=document.querySelector('#historyResult')?.value||'',size=Number(document.querySelector('#historySize')?.value)||20;let items=r.events.filter(e=>(!q||String(e.code||'').toLocaleLowerCase('vi-VN').includes(q))&&(!cls||e.className===cls)&&(!result||(result==='pass'===Boolean(e.passed)))).slice().sort((a,b)=>new Date(b.time)-new Date(a.time));let pages=Math.max(1,Math.ceil(items.length/size));historyPage=Math.min(Math.max(1,historyPage),pages);let start=(historyPage-1)*size,shown=items.slice(start,start+size);document.querySelector('#historyCount').textContent=items.length?'Hiển thị '+(start+1)+'–'+(start+shown.length)+' / '+items.length+' lượt phù hợp (tổng '+r.events.length+' lượt).':'Không có lượt thực hành phù hợp bộ lọc.';document.querySelector('#historyRows').innerHTML=shown.map(e=>`<tr><td>${new Date(e.time).toLocaleString('vi-VN')}</td><td>${esc(e.code)}</td><td>${esc(e.className)}</td><td>${esc(r.tasks.find(t=>t.id===e.taskId)?.name||e.taskId)}</td><td class="${e.passed?'good':'bad'}">${e.passed?'Đạt':'Chưa đạt'}</td></tr>`).join('')||'<tr><td colspan="5">Không có dữ liệu.</td></tr>';document.querySelector('#historyPager').innerHTML=`<button class="alt" ${historyPage===1?'disabled':''} onclick="historyPage--;renderHistory()">‹ Trang trước</button><strong>Trang ${historyPage} / ${pages}</strong><button class="alt" ${historyPage===pages?'disabled':''} onclick="historyPage++;renderHistory()">Trang sau ›</button>`}
async function assignTask(){try{await api('assign',{code:document.querySelector('#acode').value,taskId:document.querySelector('#atask').value});alertMsg('Đã giao ca bệnh',true)}catch(e){alertMsg(e.message)}}
async function resetPin(){try{await api('resetPin',{code:document.querySelector('#resetCode').value,pin:document.querySelector('#resetPin').value});document.querySelector('#resetPin').value='';alertMsg('Đã cấp lại PIN; lịch sử học sinh được giữ nguyên.',true)}catch(e){alertMsg(e.message)}}
async function teacherAI(){let el=document.querySelector('#teacherAI');el.textContent='Đang tổng hợp...';try{let r=await api('teacherAdvice');el.innerHTML='<div class="notice">'+esc(r.advice||r.fallback||'AI chưa sẵn sàng. Hãy xem bản đồ lỗi và tổ chức ôn tập các ca còn chưa đạt.')+'</div>'}catch(e){el.textContent=e.message}}
function summary(){let r=window.reportCache;if(!r)return;let by=new Map();r.events.forEach(e=>{let k=e.code+'|'+e.taskId;if(!by.has(k))by.set(k,[]);by.get(k).push(e)});let n=by.size,first=0,last=0,imp=0;for(let a of by.values()){if(a[0].passed)first++;if(a.at(-1).passed)last++;if(!a[0].passed&&a.at(-1).passed)imp++}let hs=new Set(r.events.map(e=>e.code)).size,p=x=>n?Math.round(x*1000/n)/10:0;let t='Số học sinh tham gia: '+hs+'\nTổng lượt thực hành: '+r.events.length+'\nSố cặp học sinh–ca bệnh: '+n+'\nĐạt ngay lần đầu: '+first+' ('+p(first)+'%)\nĐạt ở lượt gần nhất: '+last+' ('+p(last)+'%)\nChưa đạt rồi đạt sau khi thử lại: '+imp;document.querySelector('#summ').innerHTML='<pre class="notice" style="white-space:pre-wrap">'+esc(t)+'</pre>'}
function exportCSV(){let r=window.reportCache;if(!r)return;let lines=[['Thời gian','Mã học sinh','Lớp','Ca bệnh','Kết quả'],...r.events.map(e=>[new Date(e.time).toISOString(),e.code,e.className,r.tasks.find(t=>t.id===e.taskId)?.name||e.taskId,e.passed?'Đạt':'Chưa đạt'])];let csv='\ufeff'+lines.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');let u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='Bao_cao_Benh_vien_Tin_hoc_nhi.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
if(authToken&&role==='student')student();else if(authToken&&role==='teacher')teacher();else home();
